name: Build Digitech Algorithm APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DigitechAlgorithm_v7_PhoneBuild.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q DigitechAlgorithm_v7_PhoneBuild.zip
          cd digitech_v7
          rm -rf .github

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: digitech_v7
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-debug-apk
          path: digitech_v7/app/build/outputs/apk/debug/*.apk
